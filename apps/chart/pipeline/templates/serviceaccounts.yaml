{{- range $name := list "producer" "consumer" }}
---
# IRSA: the role's trust policy in infra/iam.tf accepts only pipeline/{{ $name }}.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    eks.amazonaws.com/role-arn: {{ index $.Values.roleArns $name | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
  labels:
    {{- include "pipeline.labels" (dict "name" $name) | nindent 4 }}
{{- end }}
