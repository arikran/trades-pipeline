{{- $env := list
  (dict "name" "BINANCE_URL" "value" .Values.binanceUrl) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    {{- include "pipeline.labels" (dict "name" "producer") | nindent 4 }}
spec:
  replicas: {{ .Values.producer.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: producer
  template:
    {{- include "pipeline.podTemplate" (dict "name" "producer" "env" $env "root" $) | nindent 4 }}
