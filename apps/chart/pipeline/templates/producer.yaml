{{- $env := list
  (dict "name" "BINANCE_URL" "value" .Values.binanceUrl) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    {{- include "pipeline.labels" (dict "name" "producer") | nindent 4 }}
spec:
  replicas: {{ .Values.producer.replicas }}
  # A rollout adds a new producer before it stops an old one, so two always run.
  # Ready only means the process started: wait 30 s more before an old one is stopped, which in
  # practice is enough for the new producer to connect (a timer, not a proof that it streams).
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: producer
  template:
    {{- include "pipeline.podTemplate" (dict "name" "producer" "env" $env "root" $ "onePerNode" true) | nindent 4 }}
